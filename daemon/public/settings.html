<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Nokta — Settings</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070d;--surface:rgba(18,18,30,0.92);--surface-2:rgba(28,28,46,0.65);--border:rgba(60,60,90,0.3);--border-hover:rgba(108,92,231,0.35);--text:#e8e8f0;--text-2:#8888aa;--text-3:#555577;--accent:#7c6cf0;--accent-soft:rgba(124,108,240,0.12);--accent-grad:linear-gradient(135deg,#7c6cf0,#b87cf0);--green:#00d68f;--red:#ff6b6b;--yellow:#ffd93d;--orange:#ff922b;--blue:#479cff;--radius:10px;--radius-sm:6px;--font:SF Mono,Fira Code,JetBrains Mono,monospace;--font-sans:Inter,SF Pro,-apple-system,BlinkMacSystemFont,sans-serif}

</head>
